<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F9C58A"/>
      <stop offset="55%" stop-color="#F2A65A"/>
      <stop offset="100%" stop-color="#D9832F"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ORBIT MARK -->
  <g transform="translate(100,100)">
    <!-- orbit rings -->
    <ellipse cx="0" cy="0" rx="88" ry="34" fill="none" stroke="#5B8DEF" stroke-width="2.5" opacity="0.55" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="88" ry="34" fill="none" stroke="#C7CBDD" stroke-width="1.5" opacity="0.35" transform="rotate(35)"/>

    <!-- orbiting node -->
    <circle cx="55" cy="-46" r="8" fill="#5B8DEF"/>

    <!-- core -->
    <circle cx="0" cy="0" r="30" fill="url(#core)" filter="url(#glow)"/>
  </g>

